<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulasi JFT</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4F2;--ink:#1B2A2F;--mut:#5B6B70;--line:#CBD5D2;--ai:#2F4C9A;--ok:#2E7D5B;--ng:#B23A48;--card:#fff;--ser:"Shippori Mincho","Yu Mincho",serif;--san:"Zen Kaku Gothic New","Yu Gothic",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--san);padding:20px 16px 40px;display:flex;justify-content:center}
main{width:100%;max-width:560px}h1{font:800 1.6rem var(--ser);margin:6px 0}.mut{color:var(--mut)}
button{font:inherit;cursor:pointer}.pri{width:100%;padding:14px;border:0;border-radius:10px;background:var(--ai);color:#fff;font-weight:700}.pri:disabled{opacity:.5}
.sec{background:none;border:1.5px solid var(--line);border-radius:10px;padding:12px;flex:1;background:var(--card)}
.row{display:flex;gap:8px;margin:14px 0}.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin-bottom:6px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--ai)}
.pas{background:var(--card);border-left:4px solid var(--ai);padding:12px 14px;border-radius:6px;margin:10px 0;white-space:pre-wrap}
.stem{font:800 1.5rem/1.5 var(--ser);margin:10px 0}.tr{color:var(--mut);margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;padding:13px 15px;margin:8px 0;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.opt.on{border-color:var(--ai);background:#E6ECFA}.opt small{display:block;color:var(--mut)}.opt.ok{border-color:var(--ok);background:#E3F2EA}.opt.ng{border-color:var(--ng);background:#F8E4E7}
img,audio{max-width:100%;margin:8px 0}.score{font:800 4rem var(--ser);text-align:center;line-height:1}
.rv{border-top:1px solid var(--line);padding:14px 0}.ex{background:var(--card);padding:10px 12px;border-radius:8px;margin-top:6px}[hidden]{display:none!important}
</style></head><body><main>
<section id="s0"><h1>Simulasi JFT</h1>
<p class="mut">Huruf dan Kosakata, Percakapan dan Ungkapan, Pemahaman Bacaan. Soal diacak tiap peserta. Nilai dan pembahasan muncul setelah selesai.</p>
<label><input type="checkbox" id="lang" checked> Tampilkan terjemahan bahasa Indonesia</label>
<p><button class="pri" id="go">Mulai simulasi</button></p><p class="mut" id="err"></p></section>
<section id="s1" hidden><div class="top"><span id="no"></span><span id="tm"></span></div><div class="bar"><i id="pg"></i></div><div id="q"></div>
<div class="row"><button class="sec" id="pv">Sebelumnya</button><button class="sec" id="nx">Berikutnya</button></div>
<button class="pri" id="fin" hidden>Selesai &amp; lihat nilai</button></section>
<section id="s2" hidden><h1>Hasil</h1><div class="score" id="sc"></div><p class="mut" style="text-align:center" id="sm"></p><div id="by"></div><div id="rv"></div><button class="pri" id="again">Ulangi dengan soal baru</button></section>
</main><script>
const $=s=>document.querySelector(s),LBL={kosakata:"Huruf dan Kosakata",percakapan:"Percakapan dan Ungkapan",mendengarkan:"Mendengarkan",bacaan:"Pemahaman Bacaan"};
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let Q=[],A=[],i=0,left=3600,tick,showId=true;
const show=n=>["s0","s1","s2"].forEach((s,k)=>$("#"+s).hidden=k!==n);
$("#go").onclick=async()=>{$("#go").disabled=true;$("#err").textContent="";
 try{const r=await fetch("/api/exam");Q=await r.json();if(!r.ok||!Q.length)throw new Error(Q.error||"Bank soal masih kosong. Jalankan generator dulu.");
  A=Q.map(()=>null);i=0;left=3600;showId=$("#lang").checked;show(1);draw();clearInterval(tick);tick=setInterval(()=>{left--;if(left<=0)finish();$("#tm").textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0")},1000)}
 catch(e){$("#err").textContent=e.message}$("#go").disabled=false};
function draw(){const q=Q[i],b=$("#q");b.replaceChildren();$("#no").textContent=`Soal ${i+1}/${Q.length} · ${LBL[q.section]}`;$("#pg").style.width=(i+1)/Q.length*100+"%";
 if(q.image_url){const m=h("img");m.src=q.image_url;m.alt="";b.append(m)}if(q.audio_url){const a=h("audio");a.src=q.audio_url;a.controls=true;b.append(a)}
 if(q.passage_ja){const p=h("div","pas",q.passage_ja);p.lang="ja";b.append(p)}
 const s=h("div","stem",q.stem_ja);s.lang="ja";b.append(s);if(showId&&q.stem_id)b.append(h("p","tr",q.stem_id));
 q.options.forEach(o=>{const e=h("button","opt"+(A[i]===o.i?" on":""),o.ja);e.lang="ja";if(showId&&o.id)e.append(h("small","",o.id));e.onclick=()=>{A[i]=o.i;draw()};b.append(e)});
 $("#pv").disabled=i===0;$("#nx").hidden=i===Q.length-1;$("#fin").hidden=i!==Q.length-1}
$("#pv").onclick=()=>{i--;draw()};$("#nx").onclick=()=>{i++;draw()};$("#fin").onclick=finish;
async function finish(){clearInterval(tick);const r=await fetch("/api/grade",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({answers:Q.map((q,k)=>({id:q.id,choice:A[k]??-1}))})});const d=await r.json();show(2);
 $("#sc").textContent=d.scaled+"/250";$("#sm").textContent=`${d.correct} benar dari ${d.total} soal. Skor ini perkiraan, bukan skor resmi JFT.`;
 const by={};d.review.forEach(x=>{(by[x.section]??={t:0,c:0}).t++;if(x.right)by[x.section].c++});$("#by").replaceChildren(...Object.entries(by).map(([k,v])=>h("p","",`${LBL[k]}: ${v.c}/${v.t}`)));
 $("#rv").replaceChildren(...d.review.map(x=>{const e=h("div","rv"),t=h("div","stem",x.stem_ja);t.lang="ja";e.append(t);
  x.options.forEach((o,k)=>{const c=h("div","opt"+(k===x.answer?" ok":k===x.chosen?" ng":""),o.ja);c.lang="ja";if(o.id)c.append(h("small","",o.id));e.append(c)});
  e.append(h("p","mut",x.chosen<0?"Tidak dijawab":x.right?"Benar":"Salah"));if(x.explanation)e.append(h("div","ex",x.explanation));return e}))}
$("#again").onclick=()=>show(0);
</script></body></html>
